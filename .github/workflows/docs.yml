name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versioningit needs tags to resolve the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # flamedisk itself is installed so build_docs.py can read its version
        # (single-sourced from git tags via versioningit).
        run: |
          pip install markdown pymdown-extensions pygments
          pip install .

      - name: Build HTML site
        run: python .github/scripts/build_docs.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
