[build-system]
requires = ["setuptools>=68", "wheel", "versioningit>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "flamedisk"
dynamic = ["version"]
description = "Flame-graph & treemap disk-usage visualiser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jon Vannucci", email = "JRVannucci@gmail.com" }]
keywords = ["disk", "usage", "flamegraph", "treemap", "storage", "du"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jrvannucci/flamedisk"
Repository = "https://github.com/jrvannucci/flamedisk"
Changelog = "https://github.com/jrvannucci/flamedisk/blob/main/CHANGELOG.md"

[project.scripts]
flamedisk = "flamedisk.cli:main"

[project.optional-dependencies]
rich = ["rich>=13"]
dev  = ["ruff>=0.4", "pytest>=7"]

# Version is derived from the latest `X.Y.Z` git tag by versioningit; there is
# no version string checked into the source tree. Tags are bare version numbers
# with no `v` prefix — tagging `1.2.3` and pushing it is what produces release
# 1.2.3 on PyPI (see .github/workflows/publish.yml). Between tags, builds get a
# PEP 440 dev version like `1.2.4.dev5+g<hash>`.
[tool.versioningit]
default-version = "0.0.0+unknown"

# Only bare numeric tags count as releases, so stray tags can't be mistaken for
# a version.
[tool.versioningit.vcs]
method = "git"
match = ["[0-9]*"]

# versioningit writes the resolved version to this module at build time so the
# installed package can expose `flamedisk.__version__` without importlib lookups.
# The file is generated, never committed (see .gitignore).
[tool.versioningit.write]
file = "flamedisk/_version.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["flamedisk*"]

[tool.setuptools.package-data]
flamedisk = ["py.typed", "template.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly so linting is reproducible everywhere. Without a
# `select`, ruff's default set is environment-dependent and CI was flagging
# rules a bare local run did not. E/F are the pycodestyle+pyflakes baseline; I
# sorts imports; UP modernises typing (safe here because every module uses
# `from __future__ import annotations`).
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on sys.path so `from conftest import ...` resolves for helpers.
pythonpath = ["tests"]
addopts = "-q --strict-markers"
