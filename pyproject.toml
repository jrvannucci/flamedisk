[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flamedisk"
dynamic = ["version"]
description = "Flame-graph & treemap disk-usage visualiser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jon Vannucci", email = "JRVannucci@gmail.com" }]
keywords = ["disk", "usage", "flamegraph", "treemap", "storage", "du"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cryocliff/flamedisk"
Repository = "https://github.com/cryocliff/flamedisk"
Changelog = "https://github.com/cryocliff/flamedisk/blob/main/CHANGELOG.md"

[project.scripts]
flamedisk = "flamedisk.cli:main"

[project.optional-dependencies]
rich = ["rich>=13"]
dev  = ["ruff>=0.4", "pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "flamedisk.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["flamedisk*"]

[tool.setuptools.package-data]
flamedisk = ["py.typed", "template.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on sys.path so `from conftest import ...` resolves for helpers.
pythonpath = ["tests"]
addopts = "-q --strict-markers"
